name: Daily Database Backup

on:
  schedule:
    # 1:00 AM UTC = 6:00 AM Tashkent Time
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing and pushing changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Download latest data from Supabase
        run: node scripts/backup_to_git.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          
          if git diff --staged --quiet; then
            echo "No database changes detected. Skipping commit."
          else
            git commit -m "auto: db backup $(date +'%Y-%m-%d')"
            git push
            echo "Backups successfully committed and pushed to GitHub!"
          fi
