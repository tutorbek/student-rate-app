      (function() {
        try {
          var saved = localStorage.getItem('rsa_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.backgroundColor = isDark ? '#202124' : '#F5F5F7';
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>

      html[data-theme="light"],
