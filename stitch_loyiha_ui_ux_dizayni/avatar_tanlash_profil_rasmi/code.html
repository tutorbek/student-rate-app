<script>
  let currentSelectedName = "Kiber Panda";

  function selectAvatar(cardElement, name, imgSrc, imgAlt) {
    // Remove active styles from all cards
    const allCards = document.querySelectorAll('.avatar-card');
    allCards.forEach(c => {
      c.classList.remove('bg-primary-fixed');
      c.classList.add('bg-surface-container-low');
      const indicator = c.querySelector('.selection-indicator');
      if (indicator) indicator.classList.add('hidden');
    });

    // Apply active style to selected card
    cardElement.classList.add('bg-primary-fixed');
    cardElement.classList.remove('bg-surface-container-low');
    const indicator = cardElement.querySelector('.selection-indicator');
    if (indicator) indicator.classList.remove('hidden');

    // Update Top Hero Preview
    const previewImg = document.getElementById('previewImage');
    const studentTitle = document.querySelector('#previewGlow + div + div span:last-child');
    if (previewImg) {
      previewImg.src = imgSrc;
      previewImg.setAttribute('data-alt', imgAlt);
    }
    if (studentTitle) {
      studentTitle.textContent = `«${name}» seriyasi`;
    }
    currentSelectedName = name;
  }

  function switchCategory(type) {
    const tab2d = document.getElementById('tab2d');
    const tab3d = document.getElementById('tab3d');

    if (type === '2d') {
      tab2d.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all shadow-xs bg-surface-container-lowest text-primary font-bold';
      tab3d.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all text-on-surface-variant hover:text-on-surface font-semibold';
    } else {
      tab3d.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all shadow-xs bg-surface-container-lowest text-primary font-bold';
      tab2d.className = 'flex-1 py-2 rounded-lg font-label-md text-label-md transition-all text-on-surface-variant hover:text-on-surface font-semibold';
    }
  }

  function confirmSaveAvatar() {
    const toast = document.getElementById('saveToast');
    const saveBtn = document.getElementById('saveAvatarBtn');

    if (saveBtn) {
      saveBtn.classList.add('opacity-80');
      saveBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-xl">sync</span><span>Saqlanmoqda...</span>';
    }

    setTimeout(() => {
      if (toast) {
        toast.classList.remove('-translate-y-24', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
      }

      if (saveBtn) {
        saveBtn.classList.remove('opacity-80');
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-xl">check</span><span>Saqlandi!</span>';
      }

      setTimeout(() => {
        if (toast) {
          toast.classList.add('-translate-y-24', 'opacity-0');
          toast.classList.remove('translate-y-0', 'opacity-100');
        }
        if (saveBtn) {
          saveBtn.innerHTML = '<span class="material-symbols-outlined text-xl">done_all</span><span>Tanlangan avatarni saqlash</span>';
        }
      }, 2400);
    }, 450);
  }
